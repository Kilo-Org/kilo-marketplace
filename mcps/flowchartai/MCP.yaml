id: flowchartai
name: FlowchartAI
description: Create and edit native flowcharts, save versions and export draw.io XML or JSON. AI tasks use existing account allowance or Credits with spending caps.
author: FlowchartAI
url: https://github.com/tanchaowen84/flowchartai-mcp
category: productivity
prerequisites:
  - A FlowchartAI account
  - An MCP client supporting Streamable HTTP and OAuth with PKCE
  - Existing account allowance or Credits for AI generation and editing
content:
  - name: Remote OAuth
    content: |
      {
        "type": "streamable-http",
        "url": "https://flowchartai.org/api/mcp"
      }
