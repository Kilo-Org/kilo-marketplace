id: momus-marketplace
name: Momus Agent Marketplace
description: >-
  Prepared data checks, dated game and Texas data lookups, original asset bundles,
  and bounded text answers for $1–$3 per result. Free discovery, guest access,
  and operator-approved hosted Stripe Checkout.
author: Momus Digital
url: https://market.momusdigital.com/agents
category: data
prerequisites:
  - Read each selected offer's input schema, example, source date, and exact scope in the agent guide.
  - A successful preparation finishes the exact result before Checkout; verified payment unlocks that artifact.
  - Purchases require the operator's authorization and hosted Stripe Checkout; this is not unattended agent payment.
content:
  - name: Free discovery
    content: |
      {
        "type": "streamable-http",
        "url": "https://market.momusdigital.com/mcp",
        "oauth": false
      }
  - name: Private guest workspace
    prerequisites:
      - Create a guest workspace with POST https://market.momusdigital.com/api/guest and save its access_token privately; see the linked guide.
      - Set MOMUS_ACCESS_TOKEN in the environment of the Kilo process to that saved token. Reuse the same token for purchase recovery and downloads.
      - Guest signup requires no email or password. Keep the token private; the endpoint does not use OAuth.
    content: |
      {
        "type": "streamable-http",
        "url": "https://market.momusdigital.com/mcp",
        "oauth": false,
        "headers": {
          "Authorization": "Bearer {env:MOMUS_ACCESS_TOKEN}"
        }
      }
