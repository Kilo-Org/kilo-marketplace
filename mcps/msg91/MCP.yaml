id: msg91
name: MSG91
description: MSG91 is a cloud communication platform that helps businesses integrate SMS, WhatsApp, Email, Voice and OTP verification into their products. This MCP lets AI assistants search MSG91 docs, browse API endpoints module by module, and work out how to call the right MSG91 API. The MCP server itself needs no API key; calling an MSG91 API is done from the terminal with the DocStar CLI (docstar-cli@2.0.1), which asks for your MSG91 authkey locally.
author: Walkover
url: https://github.com/walkover-mcp/msg91
category: development

prerequisites:
  - No API key is needed to connect to the MCP server or to search and browse the docs
  - An MSG91 account and authkey at https://msg91.com, needed only to call MSG91 APIs
  - To call MSG91 APIs, Node.js 18+ and the official DocStar CLI by Walkover, pinned to a tested version (npx docstar-cli@2.0.1, https://www.npmjs.com/package/docstar-cli/v/2.0.1), which asks for your authkey in the terminal.

content:
  - name: Remote
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.msg91.com/mcp"
      }
