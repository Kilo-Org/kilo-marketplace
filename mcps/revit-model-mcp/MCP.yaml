id: revit-model-mcp
name: Model MCP
description: >-
  Open-source MCP server for Autodesk Revit 2022 to 2027: read, audit and edit live models with 89 tools, one Undo entry per change, and a workstation read-only lock.
suggest_for:
  filename:
    - "*.rvt"
    - "*.rfa"
author: sharafutdinovdi
url: https://github.com/sharafutdinovdi/revit-model-mcp
category: productivity
prerequisites:
  - Autodesk Revit 2022 to 2027 on Windows with the matching Model MCP add-in installed and a model open
  - Install the per-user MSI from https://github.com/sharafutdinovdi/revit-model-mcp/releases/latest
  - Model edits are enabled by default and write to the open model; each change is one named Undo entry. Turn on the
    workstation read-only lock with the Read-only button on the Model MCP ribbon panel to refuse every model change
content:
  - name: UVX on Windows
    prerequisites:
      - uv installed and available on PATH
      - MCP client running on the same Windows account as Revit
    content: |
      {
        "command": "uvx",
        "args": ["revit-model-mcp"],
        "env": {
          "REVIT_MCP_HOST": "local",
          "REVIT_MCP_REDACT_PATHS": "1"
        }
      }
  - name: SSH from macOS or Linux
    prerequisites:
      - OpenSSH access to the Revit workstation as the Windows user that runs Revit
      - revit-model-mcp installed on the workstation with `uv tool install revit-model-mcp`
    content: |
      {
        "command": "ssh",
        "args": ["{{REVIT_SSH_HOST}}", "revit-model-mcp", "--redact-paths"]
      }
parameters:
  - name: Revit workstation SSH host
    key: REVIT_SSH_HOST
    placeholder: revit-pc
