id: socialdatax-sensitive-check
name: SocialDataX 敏感检测 MCP
description: "Check supplied text for sensitive wording and potential social-platform content-policy
  risks. Hosted by SocialDataX; business calls consume credits. Setup and API Key:
  https://socialdatax.com/ai?from=kilo"
author: SocialDataX
url: https://github.com/DevinChen2014/socialdatax-sensitive-check-mcp
category: productivity
prerequisites:
  - "SocialDataX account and your own API Key: https://socialdatax.com/ai?from=kilo"
  - Business tool calls consume SocialDataX credits; the account points-balance tool is free.
content:
  - name: Remote (Streamable HTTP)
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.socialdatax.com/sensitive-check/mcp",
        "headers": {
          "Authorization": "Bearer {{SOCIALDATAX_API_KEY}}"
        }
      }
parameters:
  - name: SocialDataX API Key
    key: SOCIALDATAX_API_KEY
    placeholder: your_socialdatax_api_key
