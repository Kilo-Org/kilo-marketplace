id: explorium
name: Explorium AgentSource
description: Remote MCP access to Explorium AgentSource business and prospect data. Match and fetch companies and contacts, enrich records, and track events through the hosted streamable HTTP endpoint. Sign in with browser OAuth on first use. No local install and no API key.
author: Explorium
url: https://developers.explorium.ai/mcp-docs/agentsource-mcp
category: business
prerequisites:
  - Explorium account
  - MCP client with OAuth support
content:
  - name: Remote Connector
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.explorium.ai/mcp"
      }
