id: pexafy
name: Pexafy Stock Photos
description: Free stock photos for your code, docs and slides. Say what you need in your own words and the agent
  searches Pexafy's index of millions of free-to-use photographs from Unsplash, Pexels, Pixabay and other libraries, by
  meaning or from a reference image, and returns each photo with its licence and credit line, ready to place in a page,
  a README or a deck. Read-only, works without an account, and you can connect your Pexafy account at any time.
author: Pexafy
