id: mobile-mcp
name: Mobile MCP
description: Mobile automation for iOS and Android — drive real devices, simulators, and emulators
  over a single MCP interface. Taps, swipes, and gestures; app install/launch/terminate; screenshots;
  structured UI element extraction; screen recording; and crash reports. Accessibility-first (no vision
  model required), with screenshot/coordinate fallback.
author: mobile-next
url: https://github.com/mobile-next/mobile-mcp
category: development
content:
  - name: NPX
    prerequisites:
      - Node.js 20+
      - "Android targets: Android SDK / Platform Tools (adb on PATH) plus a running emulator or connected device"
      - "iOS targets (macOS): Xcode command line tools plus a booted simulator or connected device"
      - "iOS real devices additionally need go-ios, WebDriverAgent, and a device tunnel (see the mobile-mcp wiki)"
    content: |
      {
        "command": "npx",
        "args": ["-y", "@mobilenext/mobile-mcp@latest"]
      }
