id: deja-vu
name: deja-vu
description: Searches the coding sessions already written to this machine — Kilo Code, Claude Code, Codex, Cursor, Cline,
  Roo Code, opencode and thirty-seven more — so the agent can answer from work that was done before it was installed,
  including work done in another tool.
author: vshulcz
url: https://github.com/vshulcz/deja-vu
category: data
content:
  - name: NPX
    prerequisites:
      - Node.js
    content: |
      {
        "command": "npx",
        "args": ["-y", "@vshulcz/deja-vu", "mcp"]
      }
  - name: Homebrew
    prerequisites:
      - Homebrew (`brew install vshulcz/tap/deja-vu`)
    content: |
      {
        "command": "deja",
        "args": ["mcp"]
      }
