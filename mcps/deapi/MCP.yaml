id: deapi
name: deAPI
description: Generates images, video, speech, and music, transcribes audio and video links (YouTube, TikTok, X, Twitch, Kick), and runs OCR through deAPI's hosted MCP server.
author: deAPI
url: https://github.com/deapi-ai/mcp-server-deapi
category: productivity
prerequisites:
  - deAPI account with an API key (https://app.deapi.ai/settings/api-keys)
content:
  - name: Remote API Key
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.deapi.ai/mcp?source=kilo",
        "headers": {
          "Authorization": "Bearer {{DEAPI_API_KEY}}"
        }
      }
parameters:
  - name: deAPI API key
    key: DEAPI_API_KEY
    placeholder: sk-dp-your-api-key
