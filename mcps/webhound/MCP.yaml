id: webhound
name: Webhound
description: Runs private, budgeted reports and datasets with Hound, Webhound's research harness built with DeepSeek V4
  Pro and GPT-5.4. The user's dollar budget controls research effort, and each connection authenticates to that user's
  own Webhound account before returning cited reports, datasets, sources, claims, working documents, and evidence packs.
author: Webhound
url: https://github.com/WebhoundAI/webhound-mcp
category: search
prerequisites:
  - Webhound account
content:
  - name: Hosted MCP with OAuth
    content: |
      {
        "type": "streamable-http",
        "url": "https://api.webhound.ai/api/v2/mcp"
      }
  - name: NPX
    prerequisites:
      - Node.js
    content: |
      {
        "command": "npx",
        "args": ["-y", "webhound-mcp@latest"],
        "env": {
          "WEBHOUND_KEY": "{{WEBHOUND_KEY}}"
        }
      }
    parameters:
      - name: Webhound API Key
        key: WEBHOUND_KEY
        placeholder: wh_your_webhound_api_key
