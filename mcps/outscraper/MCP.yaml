id: outscraper
name: Outscraper
description: Search and preview business catalog records, retrieve full business data, and run supported scraping and
  enrichment services. Includes service discovery, pricing, account balance, and asynchronous request results.
author: outscraper
url: https://github.com/outscraper/outscraper-mcp-server
category: web-automation
prerequisites:
  - Outscraper account and API key from https://app.outscraper.com/api-key
  - Full catalog retrieval and scraping or enrichment services are usage-based; check pricing before paid requests.
  - Setup and connection documentation at https://mcp.outscraper.com/
content:
  - name: NPX
    prerequisites:
      - Node.js 20 or newer
    content: |
      {
        "command": "npx",
        "args": ["-y", "outscraper-mcp"],
        "env": {
          "OUTSCRAPER_API_KEY": "{{OUTSCRAPER_API_KEY}}"
        }
      }
  - name: Remote HTTP (API Key)
    prerequisites:
      - Use no additional authentication; keep the complete API-key URL private.
    content: |
      {
        "type": "streamable-http",
        "url": "https://api.outscraper.com/mcp/{{OUTSCRAPER_API_KEY}}"
      }
parameters:
  - name: Outscraper API Key
    key: OUTSCRAPER_API_KEY
    placeholder: your_outscraper_api_key
