id: shipvela
name: Shipvela
description: Create website projects, deploy supported GitHub repositories, and inspect deployment status, build logs, and usage through a remote OAuth connection.
author: stefanautomateed
url: https://github.com/stefanautomateed/shipvela-codex
category: development
prerequisites:
  - A Shipvela account with public signup at https://shipvela.com/
  - An MCP client with OAuth support; approve the requested Shipvela scopes
  - An existing GitHub connection for repository discovery and deployments
content:
  - name: Hosted Remote
    content: |
      {
        "type": "streamable-http",
        "url": "https://shipvela.com/mcp"
      }
