id: autotasker-hub
name: AutoTasker Hub
description: >-
  Pay-per-call China social trending data (Weibo, Douban, Zhihu, Bilibili), keyword search and 24h digest for AI agents.
  Each paid call settles on-chain in USDC on Base via x402 (PayAI facilitator) before any data is returned.
  No account and no API key. Prices: most MCP tool calls $0.01; hotlist/search $0.05; market_scan $0.10; trend_predict $0.15; daily_report $0.25; full export/probe $0.50.
author: breezesamuel
url: https://github.com/breezesamuel/autotasker-hub-aevum
category: search
prerequisites:
  - Base mainnet wallet holding USDC (x402 pay-per-call; no signup, no API key)
  - x402-capable MCP/HTTP client (server signals HTTP 402; client sends PAYMENT-SIGNATURE header per call)
  - Per-call $0.01-$0.50; discovery https://autotasker.highkingflower.com/.well-known/x402.json; settlement proof https://autotasker.highkingflower.com/api/x402/proof
content:
  - name: Hosted HTTP MCP
    content: |
      {
        "type": "streamable-http",
        "url": "https://autotasker.highkingflower.com/mcp"
      }
