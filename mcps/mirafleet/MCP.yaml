id: mirafleet
name: mirafleet
description: Let an AI agent operate a fleet of servers through a central mirafleet server. Runners dial out over SSH, actions pass an allowlist guard (argv only, no shell, regex-validated parameters), and every call is audited. It runs commands on real servers, so start in actions mode with read-only actions, use a dedicated revocable operator per user, require confirm on production fleets, and do not auto-approve destructive tools. Open source, no telemetry.
author: MIRASTACK LABS
url: https://github.com/mirastacklabs-ai/mirafleet
category: development
prerequisites:
  - A running mirafleet central server and its fleet runners (see https://github.com/mirastacklabs-ai/mirafleet/blob/main/docs/QUICKSTART.md)
  - "One-time login from a terminal: mirafleet mcp login ADDR -name NAME -code - (the operator key is stored in mirafleet's own config directory, not in this configuration)"
  - "Least privilege: start in actions mode (only the runner's own allowlisted, argv-only, regex-validated actions) with read-only actions; use workspace mode (isolated container) only when you need it. Host credentials stay on central, never on your machine"
  - "Use a dedicated operator per user and revoke it from central (admin GUI or CLI) when done. The operator key on your machine sits in mirafleet's config directory (0700) and is per-operator and revocable"
  - "Enable confirm on production fleets (central enforces it for destructive actions) and review the central audit log. Do not auto-approve destructive mirafleet tools in Kilo; tools carry MCP annotations such as destructiveHint"
content:
  - name: NPX
    prerequisites:
      - Node.js 18+
    content: |
      {
        "command": "npx",
        "args": ["-y", "@mirastacklabs/mirafleet@0.6.1", "mcp", "-project-dir", "."]
      }
  - name: Local binary
    prerequisites:
      - "mirafleet on your PATH: brew install mirastacklabs-ai/tap/mirafleet, or the pinned v0.6.1 installers https://github.com/mirastacklabs-ai/mirafleet/releases/download/v0.6.1/install.sh (add --verify-signature to require the cosign signature; SHA-256 is always verified) and https://github.com/mirastacklabs-ai/mirafleet/releases/download/v0.6.1/install.ps1, or a signed release archive from https://github.com/mirastacklabs-ai/mirafleet/releases/tag/v0.6.1"
    content: |
      {
        "command": "mirafleet",
        "args": ["mcp", "-project-dir", "."]
      }
