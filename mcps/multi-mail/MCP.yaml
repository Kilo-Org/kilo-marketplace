id: multi-mail
name: Multi Mail
description: Your Gmail, Outlook.com, Hotmail, Microsoft 365, iCloud and Fastmail mailboxes in Kilo Code - several at once, one search across all of them. Read, draft, send and organise mail. No copy kept.
author: Lumman
url: https://github.com/lumman-lab/multi-mail
category: productivity
prerequisites:
  - Lumman account with at least one mailbox connected at https://lumman.co/mcp/account/multi-mail
  - MCP client with OAuth support
content:
  - name: Multi Mail hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://mail.lumman.co/mcp"
      }
