id: eda-agent
name: eda-agent
description: Drives a live Altium Designer session through schematic, PCB and library tools that read and edit the open design, with KiCad and EasyEDA Pro backends as well.
author: salitronic
url: https://github.com/salitronic/eda-agent
category: development
suggest_for:
  filename:
    - "*.PrjPcb"
    - "*.PcbDoc"
    - "*.SchDoc"
prerequisites:
  - Altium Designer on Windows (or KiCad / EasyEDA Pro for those backends)
  - Python 3.11 or later
content:
  - name: uvx
    prerequisites:
      - uv
      - Run "uvx eda-agent install-scripts" once so Altium can load the bridge scripts
    content: |
      {
        "command": "uvx",
        "args": ["eda-agent"],
        "env": {
          "EDA_AGENT_BACKEND": "{{EDA_AGENT_BACKEND}}"
        }
      }
  - name: pip
    prerequisites:
      - python -m pip install eda-agent
      - Run "eda-agent install-scripts" once so Altium can load the bridge scripts
    content: |
      {
        "command": "eda-agent",
        "args": [],
        "env": {
          "EDA_AGENT_BACKEND": "{{EDA_AGENT_BACKEND}}"
        }
      }
parameters:
  - name: "EDA backend: altium, kicad, easyeda, or both (Altium and KiCad together)"
    key: EDA_AGENT_BACKEND
    placeholder: altium
