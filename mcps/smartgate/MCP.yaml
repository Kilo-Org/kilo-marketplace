id: smartgate
name: SmartGate
description: Hosted MCP gateway for search, fetch, compress, dedup, budget, memory, and pipelines. Not an LLM proxy.
author: SmartGate
url: https://github.com/smartgate-network/smartgate-workflows
category: search
prerequisites:
  - A SmartGate account and API key from https://smartgate.network Dashboard → API Keys
content:
  - name: Remote
    content: |
      {
        "type": "streamable-http",
        "url": "https://smartgate.network/api/mcp",
        "headers": {
          "Authorization": "Bearer {{SMARTGATE_API_KEY}}",
          "X-SmartGate-Agent-Platform": "kilo"
        }
      }
parameters:
  - name: SmartGate API Key
    key: SMARTGATE_API_KEY
    placeholder: sk_live_REPLACE_WITH_YOUR_KEY
