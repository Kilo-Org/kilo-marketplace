id: firecrawl
name: Firecrawl
description: The context API for AI agents. Search the web, scrape pages into clean Markdown or structured data, parse
  documents, crawl and map sites, and interact with dynamic pages, plus Agent and Monitor jobs.
author: firecrawl
url: https://github.com/firecrawl/firecrawl-mcp-server
category: web-automation
content:
  - name: Remote MCP (no API key)
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.firecrawl.dev/v2/mcp"
      }
  - name: Remote MCP (API key)
    prerequisites:
      - Firecrawl account
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.firecrawl.dev/v2/mcp",
        "headers": {
          "Authorization": "Bearer {{FIRECRAWL_API_KEY}}"
        }
      }
    parameters:
      - name: Firecrawl API Key
        key: FIRECRAWL_API_KEY
        placeholder: fc-your-api-key-here
  - name: NPX
    prerequisites:
      - Node.js
      - Firecrawl account
    content: |
      {
        "command": "npx",
        "args": ["-y", "firecrawl-mcp"],
        "env": {
          "FIRECRAWL_API_KEY": "{{FIRECRAWL_API_KEY}}"
        }
      }
    parameters:
      - name: Firecrawl API Key
        key: FIRECRAWL_API_KEY
        placeholder: fc-your-api-key-here
  - name: Self-Hosted
    prerequisites:
      - Node.js
    content: |
      {
        "command": "npx",
        "args": ["-y", "firecrawl-mcp"],
        "env": {
          "FIRECRAWL_API_URL": "{{FIRECRAWL_API_URL}}",
          "FIRECRAWL_API_KEY": "{{FIRECRAWL_API_KEY}}"
        }
      }
    parameters:
      - name: Firecrawl API URL
        key: FIRECRAWL_API_URL
        placeholder: https://firecrawl.your-domain.com
      - name: Firecrawl API Key
        key: FIRECRAWL_API_KEY
        placeholder: fc-your-api-key-here
        optional: true
