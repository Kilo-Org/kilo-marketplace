id: pixeltable
name: Pixeltable
description: Multimodal AI data infrastructure MCP server with tools for tables, views,
  computed columns, document/video iterators, embeddings, queries, and a persistent Python REPL.
  Requires Pixeltable >= 0.6.3 (uvx resolves current latest).
author: pixeltable
url: https://github.com/pixeltable/mcp-server-pixeltable-developer
category: data
prerequisites:
  - Python 3.10+
  - uv (https://docs.astral.sh/uv/)
content:
  - name: UVX from Git
    description: Installs and runs the developer MCP server from GitHub (not published to PyPI).
    prerequisites:
      - Python and uv
    content: |
      {
        "command": "uvx",
        "args": [
          "--from",
          "git+https://github.com/pixeltable/mcp-server-pixeltable-developer",
          "mcp-server-pixeltable-developer"
        ],
        "env": {
          "PIXELTABLE_HOME": "{{PIXELTABLE_HOME}}",
          "OPENAI_API_KEY": "{{OPENAI_API_KEY}}"
        }
      }
  - name: UV tool install
    description: Install once with uv tool, then run the binary by name.
    prerequisites:
      - Python and uv
    content: |
      {
        "command": "mcp-server-pixeltable-developer",
        "env": {
          "PIXELTABLE_HOME": "{{PIXELTABLE_HOME}}",
          "OPENAI_API_KEY": "{{OPENAI_API_KEY}}"
        }
      }
parameters:
  - name: Pixeltable Home
    key: PIXELTABLE_HOME
    placeholder: /path/to/custom/pixeltable/home
    optional: true
  - name: OpenAI API Key
    key: OPENAI_API_KEY
    placeholder: sk-...
    optional: true
