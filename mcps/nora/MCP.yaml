id: nora
name: Nora
description: Operate a self-hosted Nora AI-agent fleet from Kilo, including deployment, lifecycle control, fleet health, metrics, events, and cost visibility.
author: Nora
url: https://github.com/solomon2773/nora
category: development
prerequisites:
  - Node.js 20 or later
  - A reachable Nora control plane and workspace API key with the scopes needed for the intended operations
content:
  - name: NPX
    prerequisites:
      - Node.js 20 or later
    content: |
      {
        "command": "npx",
        "args": ["-y", "@noraai/mcp-server@0.1.3"],
        "env": {
          "NORA_API_URL": "{{NORA_API_URL}}",
          "NORA_API_KEY": "{{NORA_API_KEY}}",
          "NORA_MCP_ALLOW_DESTRUCTIVE": "false"
        }
      }
parameters:
  - name: Nora API URL
    key: NORA_API_URL
    placeholder: https://nora.example.com
  - name: Nora API Key
    key: NORA_API_KEY
    placeholder: nora_...
