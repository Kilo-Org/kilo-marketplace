id: nora
name: Nora
description: Inspect a self-hosted Nora AI-agent fleet from Kilo, with optional write-scoped deployment and lifecycle control.
author: Nora
url: https://github.com/solomon2773/nora
category: development
prerequisites:
  - Node.js 20 or later
  - A reachable Nora control plane
  - A read-only workspace API key scoped to agents:read and monitoring:read by default; add agents:write only when you intentionally want lifecycle actions
content:
  - name: NPX (read-only key recommended)
    prerequisites:
      - Node.js 20 or later
      - Use a key without agents:write unless you intentionally want Kilo to deploy, start, stop, restart, or redeploy agents
    content: |
      {
        "command": "npx",
        "args": ["-y", "@noraai/mcp-server@0.1.3"],
        "env": {
          "NORA_API_URL": "{{NORA_API_URL}}",
          "NORA_API_KEY": "{{NORA_API_KEY}}",
          "NORA_MCP_ALLOW_DESTRUCTIVE": "false"
        }
      }
parameters:
  - name: Nora API URL
    key: NORA_API_URL
    placeholder: https://nora.example.com
  - name: Nora API Key (read-only recommended)
    key: NORA_API_KEY
    placeholder: nora_...
