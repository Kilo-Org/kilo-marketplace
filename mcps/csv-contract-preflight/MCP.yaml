id: csv-contract-preflight
name: CSV Contract Preflight MCP
description: >-
  Linux-only engineering preview; requires Python 3.11+ and manual MCPB setup.
  Agent tools for CSV contract templates, explicit drafting review,
  buyer-authorized validation and report summaries. Paid validation sends CSV
  text and contract to Apify for processing and storage. MIT adapter;
  completed Apify pass and findings reports each cost $0.01.
author: anytine123
url: https://github.com/anytine123/csv-contract-preflight-mcp
category: data
content:
  - name: Linux Python - free discovery
    prerequisites:
      - Linux and Python 3.11 or later
      - Download the exact public v0.4.0 MCPB release; verify its SHA-256 before unpacking
      - https://github.com/anytine123/csv-contract-preflight-mcp/releases/download/v0.4.0/csv-contract-preflight-mcp-0.4.0.mcpb
      - SHA-256 must equal 7a1f82cde2b251114d2b0e7a21a5d7238681b349ad47b4eaa942d3cd192b2a74
      - Use the actual absolute unpacked directory; no token is needed for tool discovery or templates
    content: |
      {
        "command": "python3",
        "args": ["-I", "-B", "{{ADAPTER_DIRECTORY}}/offer_adapter.py"]
      }
    parameters:
      - name: Unpacked v0.4.0 server directory containing offer_adapter.py
        key: ADAPTER_DIRECTORY
        placeholder: /absolute/path/to/csv-contract-preflight-0.4.0/server
  - name: Linux Python - buyer-owned Apify account
    prerequisites:
      - Linux and Python 3.11 or later
      - Download the exact public v0.4.0 MCPB release; verify its SHA-256 before unpacking
      - https://github.com/anytine123/csv-contract-preflight-mcp/releases/download/v0.4.0/csv-contract-preflight-mcp-0.4.0.mcpb
      - SHA-256 must equal 7a1f82cde2b251114d2b0e7a21a5d7238681b349ad47b4eaa942d3cd192b2a74
      - Your existing eligible Apify account token; completed reports cost $0.01
      - Follow the README for private state, contract acceptance and separate purchase confirmation
    content: |
      {
        "command": "python3",
        "args": ["-I", "-B", "{{ADAPTER_DIRECTORY}}/offer_adapter.py"],
        "env": {
          "APIFY_TOKEN": "{{APIFY_TOKEN}}"
        }
      }
    parameters:
      - name: Unpacked v0.4.0 server directory containing offer_adapter.py
        key: ADAPTER_DIRECTORY
        placeholder: /absolute/path/to/csv-contract-preflight-0.4.0/server
      - name: Your existing eligible Apify account token
        key: APIFY_TOKEN
        placeholder: your_own_existing_apify_token
