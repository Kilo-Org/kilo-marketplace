id: eu-nordic-open-data
name: EU & Nordic Open Data
description: Free MIT stdio server with 49 tools for live official EU and Nordic open data, including EU sanctions
  screening, TED tenders, VIES VAT checks, GLEIF LEI, EU VAT rates, Safety Gate, ENISA EUVD, ECB FX, Finnish and
  Norwegian company events, Fingrid grid data, FMI weather and Digitraffic port calls. Every response carries the source
  licence attribution; registry results are organisation-level, with personal names redacted.
author: itulo
url: https://github.com/itulo/eu-nordic-open-data-mcp
category: business
prerequisites:
  - Node.js 20 or newer
  - Optional free Fingrid Open Data API key (data.fingrid.fi), needed only for the Fingrid grid tools
content:
  - name: NPX
    prerequisites:
      - Node.js 20 or newer
    content: |
      {
        "command": "npx",
        "args": ["-y", "eu-nordic-open-data-mcp"],
        "env": {
          "FINGRID_API_KEY": "{{FINGRID_API_KEY}}"
        }
      }
    parameters:
      - name: Fingrid API Key
        key: FINGRID_API_KEY
        placeholder: your_fingrid_api_key
        optional: true
