id: multi-calendar
name: Multi Calendar
description: Your Outlook.com, Hotmail, Microsoft 365 and Google calendars in Kilo Code - many accounts at once, one search for free time across all of them. Read, create, move and cancel events, answer invitations, make booking links, booking pages and group polls. No copy kept.
author: Lumman
url: https://github.com/lumman-lab/multi-calendar
category: productivity
prerequisites:
  - Lumman account with at least one calendar connected at https://lumman.co/mcp/account/multi-calendar
  - MCP client with OAuth support
content:
  - name: Multi Calendar hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://calendar.lumman.co/mcp"
      }
