id: evolink
name: EvoLink
description: Generates and edits images, video, music and speech with 150+ models through EvoLink's hosted OAuth server. Agents can search models, compare prices and get a quote before each paid task; generation is billed to the signed-in account's EvoLink balance.
author: EvoLink
url: https://evolink.ai/docs/en/cli-mcp/overview
category: productivity
prerequisites:
  - EvoLink account (browser sign-in with OAuth; the hosted server needs no API key)
  - MCP client with OAuth support
  - EvoLink balance for paid generation; model search, pricing, quotes and balance checks are free
content:
  - name: EvoLink hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.evolink.ai/mcp"
      }
  - name: NPX (local, API key)
    prerequisites:
      - Node.js
      - EvoLink API key
    content: |
      {
        "command": "npx",
        "args": ["-y", "@evolinkai/mcp"],
        "env": {
          "EVOLINK_API_KEY": "{{EVOLINK_API_KEY}}"
        }
      }
    parameters:
      - name: EvoLink API Key
        key: EVOLINK_API_KEY
        placeholder: your_evolink_api_key
