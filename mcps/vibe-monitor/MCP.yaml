id: vibe-monitor
name: Vibe Monitor
description: >-
  Local architecture evolution observations and staged advice for AI coding.
  Source analysis is read-only. Apache-2.0 client with separate proprietary cloud
  policy/scoring; bounded pseudonymous telemetry defaults on, and opting out
  pauses Free analysis.
author: tubban1
url: https://github.com/tubban1/vibe-monitor
category: development
prerequisites:
  - Node.js 22 or later
  - Follow the repository setup instructions for current cloud access requirements
  - >-
    Telemetry is ON by default. Run `npx -y @vibe-monitor/setup@latest telemetry off`
    to disable collection; this also pauses Free architecture analysis. Run
    `npx -y @vibe-monitor/setup@latest telemetry on` to restore both. Inspect the
    current choice with `npx -y @vibe-monitor/setup@latest telemetry status`.
  - >-
    The NPX configuration intentionally follows the latest published stable release
    for ongoing updates. To review and pin a specific release instead, replace
    `@latest` in the configuration with its exact published version. The command
    respects your configured npm registry.
content:
  - name: NPX
    prerequisites:
      - Node.js 22 or later
    content: |
      {
        "command": "npx",
        "args": ["-y", "@vibe-monitor/setup@latest", "mcp"]
      }
