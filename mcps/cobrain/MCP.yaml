id: cobrain
name: Cobrain
description: Shared Markdown memory your AIs read and write. Load a project's notes and decisions in one call, search,
  and save as you work; the same notes reach Claude, ChatGPT, Codex, Hermes and any MCP client. Writes are
  version-checked, so two agents can't silently overwrite each other.
author: Overpress-Media
url: https://github.com/Overpress-Media/cobrain-plugin
category: data
prerequisites:
  - Cobrain account (free plan available)
  - MCP client with OAuth support
content:
  - name: Cobrain hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://cobrain.space/mcp"
      }
