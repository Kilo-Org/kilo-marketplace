id: billstride
name: Billstride
description: Creates, sends and tracks invoices from a conversation, reuses last month's invoice, chases overdue payments, reports revenue, and exports e-invoices (ZUGFeRD, XRechnung) and DATEV through Billstride's hosted OAuth server.
author: Billstride
url: https://billstride.com/mcp
category: business
prerequisites:
  - Billstride account (open sign-up, first invoice free)
  - MCP client with OAuth support
content:
