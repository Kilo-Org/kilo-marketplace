id: specstream
name: SpecStream
description: Gives agents finished lists from the live web. Describe the list in plain words and get every matching row with the page it came from, priced per match after a quoted ceiling, so a search that finds nothing costs nothing.
author: SpecStream
url: https://github.com/Specstreamai/specstream-tools
category: search
prerequisites:
  - SpecStream account (new accounts start with $10 of work free for 30 days, no card)
  - MCP client with OAuth support, or a SpecStream API key
content:
  - name: SpecStream hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://api.specstream.ai/mcp"
      }
  - name: SpecStream hosted server with an API key
    content: |
      {
        "type": "streamable-http",
        "url": "https://api.specstream.ai/mcp",
        "headers": {
          "Authorization": "Bearer {{SPECSTREAM_API_KEY}}"
        }
      }
    parameters:
      - name: SpecStream API Key
        key: SPECSTREAM_API_KEY
        placeholder: ss_live_your_key_here
