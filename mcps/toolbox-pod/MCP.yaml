id: toolbox-pod
name: Toolbox POD
description: Design custom tees and hoodies, see mockups, and order prints made and shipped from Utah. Creates shirt
  designs from a description or reference image, shows them on mockups in chosen colors, prices orders, prepares a
  draft order for one US recipient with a checkout link to pay on toolboxpod.com, and follows orders to tracking.
author: Toolbox POD
url: https://github.com/Toolbox-POD/toolbox-pod-mcp
category: business
prerequisites:
  - Toolbox POD account (you can sign up while connecting)
  - MCP client with OAuth support
content:
  - name: Toolbox POD hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.toolboxpod.com/mcp"
      }
