id: social-post-flow
name: Social Post Flow
description: Schedules and publishes social media posts to Facebook, X, LinkedIn, Instagram, Threads, Pinterest,
  TikTok, Bluesky, Mastodon, Telegram, Google Business Profile and VK. Create, schedule, reschedule and delete posts,
  review connected profiles, and see why a post failed.
author: Social Post Flow
url: https://www.socialpostflow.com/documentation/mcp/
category: productivity
prerequisites:
  - Social Post Flow account with at least one social profile connected
content:
  - name: OAuth
    content: |
      {
        "type": "streamable-http",
        "url": "https://app.socialpostflow.com/mcp"
      }
  - name: Personal access token
    content: |
      {
        "type": "streamable-http",
        "url": "https://app.socialpostflow.com/mcp",
        "headers": {
          "Authorization": "Bearer {{SOCIAL_POST_FLOW_TOKEN}}"
        }
      }
parameters:
  - name: Personal access token (only for the token option, from Integrations in Social Post Flow)
    key: SOCIAL_POST_FLOW_TOKEN
    placeholder: your_personal_access_token
    optional: true
