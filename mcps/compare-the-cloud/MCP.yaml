id: compare-the-cloud
name: Compare the Cloud
description: Searches a UK B2B technology provider directory (20,000+ cloud, MSP, cybersecurity and AI vendors) and reads Compare the Cloud articles, news and expert opinion through 10 read-only tools. No account or key is needed.
author: Compare the Cloud
url: https://github.com/danielctc/comparethecloud-mcp
category: search
content:
  - name: Streamable HTTP
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.comparethecloud.net/mcp"
      }
  - name: mcp-remote
    prerequisites:
      - Node.js
    content: |
      {
        "command": "npx",
        "args": ["-y", "mcp-remote", "https://mcp.comparethecloud.net/mcp"]
      }
