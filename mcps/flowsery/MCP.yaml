id: flowsery
name: Flowsery
description: Queries Flowsery web analytics (traffic overview, timeseries, realtime visitors, pages, referrers,
  campaigns, locations, devices, goals) and the AI-detected issues found in session recordings, and records goals and
  payments, through Flowsery's hosted OAuth server.
author: Flowsery
url: https://github.com/Flowsery/agent
category: observability
prerequisites:
  - Flowsery account with at least one tracked website
content:
  - name: Flowsery hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.flowsery.com/mcp"
      }
  - name: Flowsery hosted server with workspace API key
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.flowsery.com/mcp",
        "headers": {
          "Authorization": "Bearer {{FLOWSERY_API_KEY}}"
        }
      }
parameters:
  - name: Flowsery Workspace API Key
    key: FLOWSERY_API_KEY
    placeholder: flow_ws_your_api_key
    optional: true
