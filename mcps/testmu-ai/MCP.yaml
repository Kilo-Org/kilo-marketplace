id: testmu-ai
name: TestMu AI (formerly LambdaTest)
description: Runs, debugs and triages tests on the TestMu AI cloud through its official hosted OAuth server. Orchestrates
  HyperExecute jobs and generates their YAML, triages automation failures from command, network and console logs,
  analyzes SmartUI visual regressions, reports flaky tests, runs accessibility audits, and manages Test Manager cases
  and runs.
author: TestMu AI
url: https://github.com/LambdaTest/mcp-server-guide
