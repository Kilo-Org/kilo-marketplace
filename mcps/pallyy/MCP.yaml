id: pallyy
name: Pallyy
description: Schedule social media posts from Kilo with Pallyy's hosted MCP server. Lists your social sets and their connected accounts, creates and updates draft or scheduled posts, imports media into the library and pins calendar notes across Instagram, Facebook, LinkedIn, TikTok, YouTube, Pinterest, Threads, Bluesky, X and Google Business Profile.
author: Pallyy
url: https://github.com/pallyysocial/pallyy-agent
category: productivity
prerequisites:
  - Pallyy account (the free plan includes the MCP server)
  - MCP client with OAuth support
content:
  - name: Pallyy hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://app.pallyy.com/mcp"
      }
