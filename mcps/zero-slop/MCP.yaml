id: zero-slop
name: Zero Slop
description: Edit AI-assisted drafts and check source details with the hosted Zero Slop deslop tool. The result includes revised text, writing scores, and a review status.
author: Manav Mishra
url: https://github.com/manavmishra/ZeroSlop
category: productivity
prerequisites:
  - Internet access; drafts sent to this hosted endpoint are processed remotely.
  - No account or API key required. Free usage limits apply.
  - Review https://zero-slop.ai/privacy/ before sharing a draft. A fallback model provider may retain the draft and edit or use them to train models.
content:
  - name: Remote Server
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.zero-slop.ai/mcp"
      }
