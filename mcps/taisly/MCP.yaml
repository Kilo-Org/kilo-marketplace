id: taisly
name: Taisly Social Media Posting
description: Publishes and schedules short-form videos across connected TikTok, Instagram, YouTube, X, and Facebook accounts.
author: Taisly
url: https://github.com/taisly/agent
category: productivity
prerequisites:
  - Taisly account
  - At least one connected social account
content:
  - name: Hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://app.taisly.com/mcp"
      }
  - name: NPX
    prerequisites:
      - Node.js
    content: |
      {
        "command": "npx",
        "args": ["-y", "@taisly/agent", "mcp"]
      }
