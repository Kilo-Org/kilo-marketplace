id: zephira
name: Zephira Company Intelligence
description: Search company records, officers, shareholders, corporate groups and available financial statements with source provenance through six read-only tools. Coverage varies by company and jurisdiction; data calls use your Zephira dashboard allowance.
author: Zephira
url: https://github.com/sens663/zephira-mcp
category: business
prerequisites:
  - A Zephira dashboard account with an active production MCP API key beginning with zph_live_
  - company:read, ownership:read and financials:read scopes for the tools you use
  - Setup documentation at https://zephira.ai/developers/mcp/; API v2 Token credentials are separate from MCP dashboard Bearer keys
content:
  - name: Streamable HTTP
    content: |
      {
        "type": "streamable-http",
        "url": "https://dashboard.zephira.ai/api/mcp",
        "headers": {
          "Authorization": "Bearer {{ZEPHIRA_API_KEY}}"
        }
      }
  - name: GitHub stdio bridge
    prerequisites:
      - Node.js 22 or later with npx and Git available on PATH
    content: |
      {
        "command": "npx",
        "args": ["-y", "github:sens663/zephira-mcp"],
        "env": {
          "ZEPHIRA_API_KEY": "{{ZEPHIRA_API_KEY}}"
        }
      }
parameters:
  - name: Zephira dashboard MCP API key
    key: ZEPHIRA_API_KEY
    placeholder: zph_live_your_dashboard_mcp_key
