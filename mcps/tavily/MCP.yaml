id: tavily
name: Tavily
description: Connects AI assistants to Tavily's real-time web search and intelligent page extraction tools, with advanced
  filtering and domain controls for research and agent workflows.
author: tavily-ai
url: https://github.com/tavily-ai/tavily-mcp
category: search
prerequisites:
  - Tavily account
content:
  - name: Remote Server
    description: Connects to Tavily's hosted MCP and attributes Tavily API requests to Kilo Code with the X-Client-Name header.
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.tavily.com/mcp",
        "headers": {
          "Authorization": "Bearer {{TAVILY_API_KEY}}",
          "X-Client-Name": "kilocode"
        }
      }
  - name: NPX
    prerequisites:
      - Node.js
    content: |
      {
        "command": "npx",
        "args": ["-y", "tavily-mcp@latest"],
        "env": {
          "TAVILY_API_KEY": "{{TAVILY_API_KEY}}"
        }
      }
  - name: Docker
    prerequisites:
      - Docker
    content: |
      {
        "command": "docker",
        "args": [
          "run",
          "-i",
          "--rm",
          "-e",
          "TAVILY_API_KEY",
          "mcp/tavily"
        ],
        "env": {
          "TAVILY_API_KEY": "{{TAVILY_API_KEY}}"
        }
      }
parameters:
  - name: Tavily API Key
    key: TAVILY_API_KEY
    placeholder: your-tavily-apikey-here
