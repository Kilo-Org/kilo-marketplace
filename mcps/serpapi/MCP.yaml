id: serpapi
name: SerpApi
description: Searches Google, Bing, Yahoo, DuckDuckGo, YouTube, eBay, Amazon, Google Scholar, and 100+ other engines
  through SerpApi, returning structured JSON or token-efficient Markdown results, and extracts or crawls web page content.
author: serpapi
url: https://github.com/serpapi/serpapi-mcp
category: search
prerequisites:
  - SerpApi account
content:
  - name: Remote Server
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.serpapi.com/mcp",
        "headers": {
          "Authorization": "Bearer {{SERPAPI_API_KEY}}"
        }
      }
  - name: Self-hosted (stdio)
    prerequisites:
      - Python 3.13+
      - uv
      - Local clone of https://github.com/serpapi/serpapi-mcp
      - Run `uv sync --frozen --no-dev` in the clone before first use so the initial dependency download does not exceed Kilo's MCP startup timeout
    content: |
      {
        "command": "uv",
        "args": ["run", "--directory", "{{SERPAPI_MCP_PATH}}", "--frozen", "--no-dev", "src/stdio.py"],
        "env": {
          "SERPAPI_API_KEY": "{{SERPAPI_API_KEY}}"
        }
      }
    parameters:
      - name: Path to serpapi-mcp clone
        key: SERPAPI_MCP_PATH
        placeholder: /path/to/serpapi-mcp
parameters:
  - name: SerpApi API Key
    key: SERPAPI_API_KEY
    placeholder: your_serpapi_api_key
