id: baizhi-cloud-browser
name: Baizhi Cloud Browser
description: >-
  Baizhi Cloud Browser provides on-demand cloud browser sessions for coding
  agents. This MCP connection manages sessions and CDP access; a compatible
  CDP client performs page actions. Sessions may incur charges: check current
  prices, explicitly stop sessions you create, and check release and billing.
  Disconnecting a client does not end the remote session.
author: ctcbyzx
url: https://github.com/ctcbyzx/baizhi-cloud-browser
category: web-automation
prerequisites:
  - A Baizhi Cloud Browser account and API key
  - A separate compatible CDP client for page actions
content:
  - name: Remote Streamable HTTP
    content: |
      {
        "type": "streamable-http",
        "url": "https://capybrowser.app.baizhi.cloud/mcp",
        "headers": {
          "Authorization": "Bearer {{CAPYBROWSER_API_KEY}}"
        }
      }
parameters:
  - name: Baizhi Cloud Browser API Key
    key: CAPYBROWSER_API_KEY
    placeholder: your-api-key
