id: investboard
name: Investboard
description: >-
  Analyze holdings, fund overlap and performance; compare rebalancing and historical
  stress scenarios against your own investment plan. Two supplied-holdings tools
  work without sign-in; account tools use OAuth. No order execution or money transfers.
author: Investboard GmbH
url: https://github.com/Investboard/ai-toolkit
category: business
prerequisites:
  - Two supplied-holdings tools work without an Investboard account.
  - Account tools require OAuth, permissions, enabled sharing and the applicable Free or Premium plan.
  - Setup and all 24 tools are documented at https://investboard.com/product/mcp.
content:
  - name: Hosted Streamable HTTP
    content: |
      {
        "type": "streamable-http",
        "url": "https://app.investboard.com/mcp"
      }
