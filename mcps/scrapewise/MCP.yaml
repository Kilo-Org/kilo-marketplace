id: scrapewise
name: Scrapewise
description: Clean, matched, AI-ready product data from any website. Read product and price data from any shop or
  Amazon, see the same product matched across shops, search Google and Amazon, fetch web pages and read the rows saved
  in your account. A Full key can also build and run scrapers.
author: scrapewise
url: https://github.com/BEBOTECH-OU/scrapewise-mcp
category: web-automation
prerequisites:
  - Scrapewise account and API key (Settings > API Keys at https://scrapewise.ai)
content:
  - name: Remote MCP - Streamable HTTP
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.scrapewise.ai/mcp",
        "headers": {
          "Authorization": "Bearer {{SCRAPEWISE_API_KEY}}"
        }
      }
parameters:
  - name: Scrapewise API Key
    key: SCRAPEWISE_API_KEY
    placeholder: your_scrapewise_api_key
