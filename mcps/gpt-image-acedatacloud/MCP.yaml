id: gpt-image-acedatacloud
name: GPT Image by Ace Data Cloud
description: >-
  Generate and edit GPT Image images through Ace Data Cloud, including asynchronous task retrieval. Reuses OpenAIMCP, which also exposes chat, embedding and audio tools; not an official OpenAI plugin.
author: Ace Data Cloud
url: https://github.com/AceDataCloud/MCPs/blob/ec865bc/openai/kilo/README.md
category: productivity
prerequisites:
  - Ace Data Cloud account with access to GPT Image; generation may incur usage charges
  - An Ace Data Cloud application API token, not a platform management token
  - Use global installation for credentials; do not commit tokens to project configuration
content:
  - name: Hosted (API token)
    content: |
      {
        "type": "streamable-http",
        "url": "https://openai.mcp.acedata.cloud/mcp",
        "headers": {
          "Authorization": "Bearer {{ACEDATACLOUD_API_TOKEN}}"
        },
        "oauth": false
      }
  - name: Local (UVX, pinned)
    prerequisites:
      - Python 3.10 or later and uv with uvx available on PATH
    content: |
      {
        "command": "uvx",
        "args": [
          "mcp-openai-pro==2026.10.17.0"
        ],
        "env": {
          "ACEDATACLOUD_API_TOKEN": "{{ACEDATACLOUD_API_TOKEN}}"
        }
      }
parameters:
  - name: Ace Data Cloud API Token
    key: ACEDATACLOUD_API_TOKEN
    placeholder: Paste only your application API token
