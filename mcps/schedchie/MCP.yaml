id: schedchie
name: Schedchie
description: Schedules, cross-posts, edits, retries and deletes posts on TikTok, Instagram, LinkedIn, Facebook, YouTube, X, Threads, Pinterest, Bluesky and Google Business Profile through Schedchie's hosted OAuth 2.1 server, uploads media by link and reads analytics. Users pick six permission groups at sign-in, listed at https://www.schedchie.com/ai. Posting to X is included in paid plans under fair use.
author: Schedchie
url: https://www.schedchie.com/ai
category: productivity
prerequisites:
  - Schedchie account with an active plan or trial
  - Social accounts connected in the Schedchie web app
  - An MCP client that supports OAuth sign-in with dynamic client registration for remote servers
content:
  - name: Schedchie hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.schedchie.com/mcp"
      }
