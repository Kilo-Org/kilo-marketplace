id: baizhi-agent-toolkit
name: Baizhi Cloud Agent Toolkit
description: >-
  Connects agents to web search, webpage and document parsing, image tools,
  developer documentation, and cloud code execution through one hosted MCP
  endpoint. Supports research and development workflows with a shared API key.
author: Baizhi Cloud
url: https://github.com/chaitin/baizhi-agent-toolkit
category: search
prerequisites:
  - A Baizhi Cloud account and API key from https://agent-toolkit.app.baizhi.cloud/
  - Available service credits; tool calls use the hosted service's credit-based pricing
  - Network access to https://agent-toolkit.app.baizhi.cloud/mcp
  - The linked repository contains integration files and documentation; the hosted backend is not open source
content:
  - name: Streamable HTTP
    content: |
      {
        "type": "streamable-http",
        "url": "https://agent-toolkit.app.baizhi.cloud/mcp",
        "headers": {
          "Authorization": "Bearer {{BAIZHI_API_KEY}}"
        }
      }
parameters:
  - name: Baizhi Cloud API Key
    key: BAIZHI_API_KEY
    placeholder: your_baizhi_api_key
