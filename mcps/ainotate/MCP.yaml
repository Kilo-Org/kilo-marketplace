id: ainotate
name: AInotate
description: Annotated screenshots for AI agents. Captures a web page or desktop window, finds elements by text or role, and draws numbered steps, arrows, boxes and labels placed off the content, with emails and tokens redacted automatically. For "where do I click" answers, bug reports and how-to guides.
author: DontPayFull
url: https://github.com/dontpayfull/AInotate
category: development
prerequisites:
  - Python and uv
  - Chromium for web capture (one time, uvx --from "ainotate[all]" playwright install chromium)
content:
  - name: UVX
    prerequisites:
      - Python and uv
    content: |
      {
        "command": "uvx",
        "args": ["--from", "ainotate[all]", "ainotate", "mcp"]
      }
