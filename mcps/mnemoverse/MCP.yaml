id: mnemoverse
name: Mnemoverse Memory
description: Long-term memory for AI agents that persists across sessions and across every tool connected to the same account. Save preferences, decisions and lessons, recall them by natural-language search, rate a recalled memory as helpful or misleading to re-rank what comes back next, and share memory through shared rooms (beta).
author: Mnemoverse
url: https://github.com/mnemoverse/mcp-memory-server
category: data
prerequisites:
  - Mnemoverse account (free plan)
content:
  - name: Remote Server (OAuth)
    prerequisites:
      - MCP client with OAuth support
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.mnemoverse.com/mcp"
      }
  - name: NPX
    prerequisites:
      - Node.js
    content: |
      {
        "command": "npx",
        "args": ["-y", "@mnemoverse/mcp-memory-server"],
        "env": {
          "MNEMOVERSE_API_KEY": "{{MNEMOVERSE_API_KEY}}"
        }
      }
    parameters:
      - name: Mnemoverse API Key
        key: MNEMOVERSE_API_KEY
        placeholder: mk_live_your_key_from_console.mnemoverse.com
