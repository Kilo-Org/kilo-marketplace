id: dropthehassle
name: DropTheHassle
description: Your AI puts your site live on a free HTTPS link with no account. Email is optional; after go-live, it asks once
  if you want a .com (€19/$19 a year, no DNS) and an optional mailbox. It returns the live link and a claim link. For the
  .com it hands you a payment link, and after you pay the site goes live on it. The mailbox on the domain sends and receives. Edit files changes one file without a rebuild, and Restore undoes the last Update or Edit files save. Collect leads turns on a contact form on a claimed site; messages land in your mailbox. An optional password locks a claimed site until you're ready; an empty password means public. Hide from Google asks search engines to skip a claimed site; visitors can still open it. No tool spends money.
author: DropTheHassle
url: https://github.com/bosmdavid-gif/dropthehassle-mcp
category: development
content:
  - name: NPX
    content: |
      {
        "command": "npx",
        "args": ["-y", "dropthehassle-mcp@latest"],
        "env": {
          "DTH_TOKEN": "{{DTH_TOKEN}}"
        }
      }
    parameters:
      - name: DropTheHassle token (optional, only for sites already on your account)
        key: DTH_TOKEN
        placeholder: dth_...
        optional: true
    prerequisites:
      - Node.js
  - name: Remote Server
    content: |
      {
        "type": "streamable-http",
        "url": "https://dropthehassle.com/mcp"
      }
