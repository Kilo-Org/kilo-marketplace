id: dropthehassle
name: DropTheHassle
description: Lets your AI publish a site on a free HTTPS link, no account needed for the first deploy. For a .com
  (€19/$19) it hands you a payment link; after you pay, the site goes live on it with no DNS. A mailbox on the
  domain is optional. Edit files changes one file without a rebuild, and Restore undoes the last Update or Edit files save. Collect leads turns on a contact form on a claimed site; messages land in your mailbox. An optional password locks a claimed site until you're ready; an empty password means public. The AI never pays.
author: DropTheHassle
url: https://github.com/bosmdavid-gif/dropthehassle-mcp
category: development
content:
  - name: NPX
    content: |
      {
        "command": "npx",
        "args": ["-y", "dropthehassle-mcp@latest"],
        "env": {
          "DTH_TOKEN": "{{DTH_TOKEN}}"
        }
      }
    parameters:
      - name: DropTheHassle token (optional, only for sites already on your account)
        key: DTH_TOKEN
        placeholder: dth_...
        optional: true
    prerequisites:
      - Node.js
  - name: Remote Server
    content: |
      {
        "type": "streamable-http",
        "url": "https://dropthehassle.com/mcp"
      }
