id: aimlapi
name: AI/ML API
description: Find and compare AI models, run chat, embeddings, image, video and audio generation, and call Agent Tools such as web search and page extraction.
author: AI/ML API
url: https://docs.aimlapi.com/quickstart/mcp
category: development
prerequisites:
  - AI/ML API account
content:
  - name: AI/ML API hosted OAuth server
    prerequisites:
      - MCP client with OAuth support
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.aimlapi.com/mcp"
      }
  - name: Remote API Key
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.aimlapi.com/mcp",
        "headers": {
          "Authorization": "Bearer {{AIMLAPI_API_KEY}}"
        }
      }
parameters:
  - name: AI/ML API Key
    key: AIMLAPI_API_KEY
    placeholder: your_aimlapi_api_key
    optional: true
