id: pachca
name: Pachca
description: >-
  Official hosted MCP server for Pachca team chat. Search and read discussions,
  send messages and thread replies, and manage reminders, chats and bots within
  the connected account's permissions, workspace role, chat access and plan.
author: Pachca
url: https://github.com/pachca/openapi
category: productivity
prerequisites:
  - A Pachca workspace account with API access enabled.
  - >-
    A personal API token created in Pachca under Integrations > API, with scopes
    for the actions you need. Guests cannot use the API. A workspace administrator
    may need to allow employees to create personal tokens.
  - >-
    Store your token securely and enter it only in the client's local setup.
    Do not commit real tokens to a repository. No local MCP server installation
    is required.
  - "Connection documentation: https://dev.pachca.com/guides/mcp/connect"
content:
  - name: Remote (Streamable HTTP)
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.pachca.com/mcp",
        "headers": {
          "Authorization": "Bearer {{PACHCA_TOKEN}}"
        }
      }
parameters:
  - name: Pachca personal API token
    key: PACHCA_TOKEN
    placeholder: your_pachca_personal_api_token
