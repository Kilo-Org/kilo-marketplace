id: soldfetch
name: SoldFetch
description: Search eBay sold and active listings, browse categories, and retrieve item details for resale research through the hosted SoldFetch API.
author: ricciflow-api
url: https://github.com/ricciflow-api/soldfetch-mcp
category: search
prerequisites:
  - A SoldFetch account and API key from https://soldfetch.com/dashboard
  - Available SoldFetch request quota; each successful data tool call costs one request
content:
  - name: Remote
    content: |
      {
        "type": "streamable-http",
        "url": "https://soldfetch.com/api/mcp",
        "headers": {
          "Authorization": "Bearer {{SOLDFETCH_API_KEY}}"
        }
      }
parameters:
  - name: SoldFetch API Key
    key: SOLDFETCH_API_KEY
    placeholder: your_soldfetch_api_key
