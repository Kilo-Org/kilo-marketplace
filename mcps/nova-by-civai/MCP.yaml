id: nova-by-civai
name: Nova by CIVAI
description: Selectable hosted MCP servers for the Nova agent catalog by CIVAI TECHNOLOGIES, covering research, documents and slides, spreadsheets, email and messaging, browser automation, code execution, social publishing and lead discovery. Each server is a separate Streamable HTTP endpoint using Nova OAuth or a Nova API key.
author: CIVAI TECHNOLOGIES
url: https://nova.civai.co
category: productivity
prerequisites:
  - Nova account at https://nova.civai.co
  - Sign in with OAuth when prompted, or create an API key at https://nova.civai.co/api-keys
