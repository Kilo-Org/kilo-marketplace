id: melra
name: MELRA
description: >-
  Local execution runtime for MCP agents. MELRA applies policy checks, scoped
  approvals, verification, and durable receipts to tool effects across files,
  terminals, browsers, computer control, HTTP, and operational memory, with
  recovery for interrupted effects.
author: XAGI Labs
url: https://github.com/XAGI-Lab/melra
category: development
prerequisites:
  - Node.js 22+ for the NPX option, or Docker for the container option
content:
  - name: NPX
    prerequisites:
      - Node.js 22+
    content: |
      {
        "command": "npx",
        "args": ["-y", "@melra/cli@alpha", "serve"],
        "env": {
          "MELRA_WORKSPACE": "{{WORKSPACE_DIR}}"
        }
      }
    parameters:
      - name: Workspace directory
        key: WORKSPACE_DIR
        placeholder: /absolute/path/to/project
  - name: Docker
    prerequisites:
      - Docker
    content: |
      {
        "command": "docker",
        "args": [
          "run",
          "-i",
          "--rm",
          "--mount",
          "type=bind,src={{WORKSPACE_DIR}},dst=/workspace",
          "--mount",
          "type=bind,src={{MELRA_HOME}},dst=/data",
          "ghcr.io/xagi-lab/melra:alpha"
        ]
      }
    parameters:
      - name: Workspace directory
        key: WORKSPACE_DIR
        placeholder: /absolute/path/to/project
      - name: MELRA data directory
        key: MELRA_HOME
        placeholder: /absolute/path/to/melra-data
