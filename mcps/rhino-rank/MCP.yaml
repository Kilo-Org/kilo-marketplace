id: rhino-rank
name: Rhino Rank
description: Quote, order and manage link building and press releases in your Rhino Rank account, including the link
  catalogue, quotes, orders and coupons, the monthly Managed Service, press-release briefs and approval, account
  details and support requests.
author: Rhino Rank
url: https://app.rhinorank.io/mcp/setup
category: business
prerequisites:
  - Rhino Rank account
content:
  - name: Remote (OAuth sign-in)
    prerequisites:
      - MCP client with OAuth support
    content: |
      {
        "type": "streamable-http",
        "url": "https://app.rhinorank.io/mcp"
      }
  - name: Remote (personal API key)
    content: |
      {
        "type": "streamable-http",
        "url": "https://app.rhinorank.io/mcp",
        "headers": {
          "Authorization": "Bearer {{RHINO_RANK_API_KEY}}"
        }
      }
    parameters:
      - name: Rhino Rank API Key
        key: RHINO_RANK_API_KEY
        placeholder: your_rhino_rank_api_key
