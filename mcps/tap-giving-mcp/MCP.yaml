id: tap-giving-mcp
name: NFC Tap Builder by Tap.Giving
description: Hosted MCP server for designing and ordering custom NFC tap discs for organizations, including churches, nonprofits, restaurants, coffee shops, and local businesses. Discovery, pricing, product facts, artwork spec, and order questions are keyless; recap and order status are keyed reads; order placement uses an organization API key.
author: Tap.Giving
url: https://github.com/RyanShook/tap-giving-mcp
category: business
prerequisites:
  - No account or key is needed for discovery, pricing, product facts, artwork spec, and order questions
  - An organization API key from Tap.Giving is required for recap, order status, and placing an order
content:
  - name: Hosted (Streamable HTTP)
    content: |
      {
        "type": "streamable-http",
        "url": "https://tap.giving/mcp"
      }
