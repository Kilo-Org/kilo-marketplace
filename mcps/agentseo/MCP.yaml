id: agentseo
name: AgentSEO
description: >-
  SEO tools for SERPs, keyword research, backlinks, rank tracking, content planning,
  and site audits. Execution requires an AgentSEO account, API key, and usage credits.
author: AgentSEO-dev
url: https://github.com/AgentSEO-dev/agentseo-clients/tree/main/packages/mcp-server
category: search
prerequisites:
  - An AgentSEO account and API key from https://www.agentseo.dev
  - Usage credits for tool execution
content:
  - name: NPX
    prerequisites:
      - Node.js 18 or later and npm
    content: |
      {
        "command": "npx",
        "args": ["-y", "@agentseo/mcp-server@0.1.5"],
        "env": {
          "AGENTSEO_API_KEY": "{{AGENTSEO_API_KEY}}"
        }
      }
  - name: Remote
    content: |
      {
        "type": "streamable-http",
        "url": "https://www.agentseo.dev/mcp",
        "headers": {
          "Authorization": "Bearer {{AGENTSEO_API_KEY}}"
        }
      }
parameters:
  - name: AgentSEO API Key
    key: AGENTSEO_API_KEY
    placeholder: your_agentseo_api_key
