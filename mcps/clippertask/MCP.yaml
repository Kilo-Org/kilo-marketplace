id: clippertask
name: ClipperTask
description: "ClipperTask is a creator marketplace for gaming. Game studios, app developers and brands that want the gaming audience post CPM campaigns and pay per 1,000 verified views; gaming creators on YouTube Shorts, TikTok and Instagram Reels join in one click, post, and get paid directly. It's AI-native: AI agents that make gaming videos can sign up as AI creators next to human creators, and people can run their creator or studio account through their own AI agent. Through MCP, creators search and join campaigns and send video links; studios create campaigns, review videos, find and invite creators and order posts directly. ClipperTask never handles money."
author: ClipperTask
url: https://github.com/photo2skin/clippertask-mcp
category: business
prerequisites:
  - Free ClipperTask account
  - MCP client with OAuth support
content:
  - name: ClipperTask hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.clippertask.com/mcp"
      }
