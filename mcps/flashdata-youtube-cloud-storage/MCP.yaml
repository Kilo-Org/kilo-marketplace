id: flashdata-youtube-cloud-storage
name: FlashData YouTube Download to Cloud Storage
description: "Deliver YouTube video, audio or clips to your own S3 or other supported cloud storage. Track asynchronous delivery and its output manifest. For AI agents using the paid FlashData API."
author: FlashData
url: https://github.com/rocosen/flashdata-mcp/tree/main/registry/servers/youtube-download
category: web-automation
prerequisites:
  - "FlashData account and an API key with access to youtube_download (https://flashdata.dev/app/api-keys)."
  - "Data queries consume your FlashData Credits; see https://flashdata.dev/pricing. Installation is free."
  - "Setup and usage: https://github.com/rocosen/flashdata-mcp/blob/main/registry/guides/youtube_download.md"
  - "FlashData is an independent provider, not affiliated with Google or YouTube."
  - "A supported destination bucket and write credentials are required per delivery. Use only content you are authorized to download; destination storage charges may apply."
content:
  - name: "NPX (macOS / Linux)"
    prerequisites:
      - Node.js 22.18.0 or later
    content: |
      {
        "command": "npx",
        "args": [
          "-y",
          "@flashdata-dev/youtube-cloud-storage@0.1.1",
          "mcp"
        ],
        "env": {
          "FLASHDATA_API_KEY": "{{FLASHDATA_API_KEY}}"
        }
      }
  - name: "NPX (Windows)"
    prerequisites:
      - Node.js 22.18.0 or later
    content: |
      {
        "command": "npx.cmd",
        "args": [
          "-y",
          "@flashdata-dev/youtube-cloud-storage@0.1.1",
          "mcp"
        ],
        "env": {
          "FLASHDATA_API_KEY": "{{FLASHDATA_API_KEY}}"
        }
      }
parameters:
  - name: FlashData API Key
    key: FLASHDATA_API_KEY
    placeholder: your-flashdata-api-key
