id: sarj
name: Sarj AI
description: >-
  Read call history, details, transcripts, and analyses from Sarj AI's Arabic-first
  enterprise voice platform. Call-management tools require separate calls:write
  authorization. Review the server-discovered OAuth permissions before granting access.
author: Sarj AI
url: https://github.com/sarj-ai/mcp-integrations
category: business
prerequisites:
  - An existing Sarj organization account with access to the intended calls
  - An account role permitted to create API credentials for Sarj OAuth authorization
  - Complete browser OAuth sign-in and review every requested permission; clients may request additional server-discovered scopes
content:
  - name: Remote OAuth
    content: |
      {
        "type": "streamable-http",
        "url": "https://platform-api.sarj.ai/api/v1/mcp",
        "oauth": {
          "clientId": "sarj-mcp-public",
          "scope": "calls:read"
        }
      }
