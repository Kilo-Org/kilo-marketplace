id: jobhunt
name: JobHunt
description: "Keeps your job search in one place and lets your AI assistant work in it: save jobs, tailor resumes, track applications and prepare for interviews. Nothing is sent to an employer for you."
author: JobHunt App, Inc.
url: https://github.com/chrisstroud/jobhunt-connect
category: productivity
prerequisites:
  - JobHunt account
  - MCP client with OAuth support
content:
  - name: JobHunt hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://jobhunt.app/mcp"
      }
