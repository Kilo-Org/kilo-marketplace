id: tday
name: tday
description: Lets your coding agent record narrated demo videos of the app you are building. The agent starts a second copy of your app on your machine with throwaway data and records it one narrated line at a time (web apps, Electron apps, terminal tools, iPhone apps in the iOS Simulator and Android apps on the emulator); tday voices every line, adds the cursor, camera, captions, music and your brand, and renders a demo you can edit and embed in your docs. The hosted server covers tday brands, credits, product screens and launch videos.
author: tday
url: https://docs.tday.com/coding-agents
category: development
prerequisites:
  - tday account (free plan available)
content:
  - name: tday hosted OAuth server
    prerequisites:
      - MCP client with OAuth support
    content: |
      {
        "type": "streamable-http",
        "url": "https://tday.com/api/mcp"
      }
  - name: NPX (local demo recording)
    prerequisites:
      - Node.js
    content: |
      {
        "command": "npx",
        "args": ["-y", "@tday-com/mcp@latest", "serve"]
      }
