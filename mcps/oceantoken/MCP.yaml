id: oceantoken
name: OceanToken
description: Search and price 480+ AI models from many labs, estimate what a request costs, generate images, video and voice-overs, transcribe audio into subtitles, and hand sub-tasks to another model, billed to a prepaid OceanToken balance.
author: OceanToken
url: https://github.com/OceanTokenAI/oceantoken-plugins
category: development
prerequisites:
  - OceanToken account with credit (https://app.oceantoken.ai/ui/signup/)
content:
  - name: Remote OAuth
    prerequisites:
      - MCP client with OAuth support
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.oceantoken.ai/mcp"
      }
  - name: Remote API Key
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.oceantoken.ai/mcp",
        "headers": {
          "Authorization": "Bearer {{OCEANTOKEN_API_KEY}}"
        }
      }
parameters:
  - name: OceanToken API Key
    key: OCEANTOKEN_API_KEY
    placeholder: your_oceantoken_api_key
    optional: true
