id: openany
name: OpenAny
description: The B2A (business to agent) marketplace. One MCP endpoint for 3,200+ APIs and 168+ AI models. Browse free; pay per call.
author: openanysi
url: https://github.com/openanysi/openany-mcp
category: development
prerequisites:
  - Searching and checking prices is free with no key. You only need an OpenAny API key to run a call, and you pay per call.
content:
  - name: Remote
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.openany.si",
        "headers": {
          "Authorization": "Bearer {{OPENANY_API_KEY}}"
        }
      }
parameters:
  - name: OpenAny API Key
    key: OPENANY_API_KEY
    placeholder: your_openany_api_key
