id: openany
name: OpenAny
description: OpenAny is the B2A (business to agent) marketplace. Give your agent 3,200+ APIs and 168+ AI models with one key and pay-per-call pricing. openany.si
author: openanysi
url: https://github.com/openanysi/openany-mcp
category: development
prerequisites:
  - An OpenAny API key from https://openany.si is required. No top-up or balance is needed to call the many free data APIs; paid APIs are charged per call.
content:
  - name: Remote
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.openany.si",
        "headers": {
          "Authorization": "Bearer {{OPENANY_API_KEY}}"
        }
      }
parameters:
  - name: OpenAny API Key
    key: OPENANY_API_KEY
    placeholder: your_openany_api_key
