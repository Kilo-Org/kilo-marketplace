id: while
name: while.sh
description: Deploys the apps an agent builds, for the user's team only or for everyone, with their PostgreSQL databases, scheduled jobs and storage, hosted in France. Reads their logs, metrics and errors; sensitive actions wait for a person's approval. Free to try without an account.
author: Nextmap
url: https://github.com/while-sh/while
category: development
prerequisites:
  - MCP client with OAuth support
content:
  - name: while.sh hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://app.while.sh/mcp"
      }
