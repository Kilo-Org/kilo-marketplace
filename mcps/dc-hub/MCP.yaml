id: dc-hub
name: DC Hub
description: "DC Hub: the orchestration layer for data center and energy intelligence. One read-only server for facilities, colocation, power and grid, interconnection queues, electricity and gas prices, fiber and site selection, including the Data Center Power Index (DCPI). Its execute_plan tool chains the right tools into one dated, cited answer. Works without an API key; a key is optional."
author: DC Hub
url: https://github.com/azmartone67/dchub-mcp-server
category: data
content:
  - name: Remote Server (no key)
    content: |
      {
        "type": "streamable-http",
        "url": "https://dchub.cloud/mcp?via=directory&src=kilo-marketplace"
      }
  - name: Remote Server (API key)
    prerequisites:
      - DC Hub API key (https://dchub.cloud/developers)
    content: |
      {
        "type": "streamable-http",
        "url": "https://dchub.cloud/mcp?via=directory&src=kilo-marketplace",
        "headers": {
          "X-API-Key": "{{DCHUB_API_KEY}}"
        }
      }
    parameters:
      - name: DC Hub API Key
        key: DCHUB_API_KEY
        placeholder: your_dchub_api_key
