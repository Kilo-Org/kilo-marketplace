id: arcmira
name: 'Arcmira: YouTube Transcript Search'
description: >-
  YouTube transcript search and monitoring for your AI: exact quotes, full transcripts and speakers.
author: arcmira
url: https://github.com/arcmira/mcp
category: search
prerequisites:
  - Arcmira https://arcmira.com
  - API documentation https://arcmira.com/docs
  - An Arcmira account and API key from https://arcmira.com/dashboard/api
content:
  - name: Remote
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.arcmira.com/mcp",
        "headers": {
          "Authorization": "Bearer {{ARCMIRA_API_KEY}}"
        }
      }
parameters:
  - name: Arcmira API key
    key: ARCMIRA_API_KEY
    placeholder: your_arcmira_api_key
