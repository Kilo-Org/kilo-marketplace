id: arcmira
name: 'Arcmira: YouTube Transcript Search'
description: >-
  Search indexed YouTube videos and livestreams for timestamped quotes,
  people and company mentions, sponsors, and organic recommendations.
  Research tools are read-only. A separate Premium transcript preparation
  action uses included credits; new monetary charges require an explicitly
  approved amount. Coverage and access depend on your account.
author: arcmira
url: https://github.com/arcmira/mcp
category: search
prerequisites:
  - An Arcmira account and API key from https://arcmira.com/dashboard/api
  - Premium preparation and commercial intelligence depend on account entitlements
content:
  - name: Remote
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.arcmira.com/mcp",
        "headers": {
          "Authorization": "Bearer {{ARCMIRA_API_KEY}}"
        }
      }
parameters:
  - name: Arcmira API key
    key: ARCMIRA_API_KEY
    placeholder: your_arcmira_api_key
