id: words-into-music
name: Words into Music
description: >-
  Generate songs from prompts or lyrics, check song credits, and retrieve private
  song links through the hosted Words into Music OAuth server. The connector is
  free to install. Song generation uses the connected account's credits.
author: Words into Music
url: https://github.com/constantinginga/words-into-music-mcp
category: productivity
prerequisites:
  - A Words into Music account and browser-based OAuth authorization
  - An available song credit to generate music. Free accounts receive one song total.
  - Setup and tool documentation at https://wordsintomusic.com/mcp/
  - The linked repository contains public connection metadata and documentation. The hosted application source is private.
content:
  - name: Remote OAuth
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.wordsintomusic.com/mcp"
      }
