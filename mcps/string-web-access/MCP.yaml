id: string-web-access
name: String Web Access
description: Search the web, fetch any URL or send it a request, and map a site's URLs — all
  returned as clean, LLM-ready Markdown.
author: usestring
url: https://github.com/usestring/string-ai-mcp
category: web-automation
prerequisites:
  - String account, created at https://portal.usestring.ai
content:
  - name: Remote MCP
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.usestring.ai/v3/mcp",
        "headers": {
          "Authorization": "Bearer {{STRING_API_KEY}}"
        }
      }
  - name: NPX
    prerequisites:
      - Node.js
    content: |
      {
        "command": "npx",
        "args": ["-y", "@usestring/mcp"],
        "env": {
          "STRING_AI_API_KEY": "{{STRING_API_KEY}}"
        }
      }
parameters:
  - name: String API Key
    key: STRING_API_KEY
    placeholder: your_string_api_key_here
