id: local-commander
name: Local Commander
description: Work on approved projects on your own Windows computers through the hosted Local Commander server. Read files and Git, run the checks you approve, and check local services. Sign-in uses OAuth 2.0 in the browser.
author: Peter Mamrukov
url: https://github.com/netbka/local-commander-plugins
category: development
prerequisites:
  - A Local Commander account at https://localcmd.app
  - A Windows 11 PC with the Local Commander agent paired (npx local-commander-agent@latest)
content:
  - name: Remote (OAuth)
    content: |
      {
        "type": "streamable-http",
        "url": "https://localcmd.app/mcp"
      }
  - name: NPX bridge (mcp-remote)
    prerequisites:
      - Node.js
    content: |
      {
        "command": "npx",
        "args": ["-y", "mcp-remote@0.15.1", "https://localcmd.app/mcp"]
      }
