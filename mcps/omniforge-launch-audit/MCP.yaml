id: omniforge-launch-audit
name: OmniForge Launch Audit
description: Audit website security headers and exposed JS bundle secrets, SPF/DKIM/DMARC/BIMI email deliverability, llms.txt AI search readiness, and 78-TLD brand availability via 5 read-only tools.
author: zColdWater
url: https://github.com/zColdWater/mcp-launch-audit
category: development
content:
  - name: NPX (Pinned Commit)
    prerequisites:
      - Node.js 18+
      - Git
    content: |
      {
        "command": "npx",
        "args": ["-y", "github:zColdWater/mcp-launch-audit#ca7f49cf598557f0092646de51cc1c320f885f5c"]
      }
  - name: Streamable HTTP (Hosted)
    prerequisites:
      - Hosted endpoint verified in Official MCP Registry (io.github.zColdWater/mcp-launch-audit); use NPX above to run locally from pinned source
    content: |
      {
        "type": "streamable-http",
        "url": "https://omnipulse-x402.appwrite.network/mcp"
      }
