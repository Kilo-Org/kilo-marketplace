id: weir
name: Weir
description: Searches and reads public X (Twitter) and Reddit data, including posts, replies, threads, quotes, profiles, followers, subreddits and comment threads, and runs monitors that report new matches.
author: Weir
url: https://github.com/tarun-khatri/weir-mcp
category: data
prerequisites:
  - Weir account (free; 5,000 credits a month)
  - MCP client with OAuth support
content:
  - name: Weir hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://api.weirapp.io/mcp"
      }
