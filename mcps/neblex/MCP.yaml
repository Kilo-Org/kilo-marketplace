id: neblex
name: Neblex Integration Fabric
description: Official hosted MCP server for Neblex Integration Fabric, an integration platform (iPaaS). Build, validate,
  test and run integration flows and AI agents across 300+ connectors, open a failed run and see the step and record it
  broke on, add deduplication and validation steps, and check flow health. Sign in with your Neblex account; no API
  key needed.
author: Neblex
url: https://github.com/neblexhq/neblex-cursor-plugin
category: productivity
prerequisites:
  - Neblex account (free Starter plan available)
  - MCP client with OAuth support
content:
  - name: Neblex hosted OAuth server
    content: |
      {
        "type": "streamable-http",
        "url": "https://if.neblex.com/mcp"
      }
