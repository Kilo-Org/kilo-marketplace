id: pdf-table-pull-lite
name: PDF Table Pull Lite
description: Pulls the tables out of local text PDFs, as CSV text or CSV files. One tool, extract_pdf_tables, with page selection and a choice of table-finding strategy. Runs on your computer with no API key; scanned PDFs need OCR first.
author: Tidy Byte Tools
url: https://github.com/tidybytetools/pdf-table-pull-lite
category: data
prerequisites:
  - Python 3.10 or later
content:
  - name: UVX
    prerequisites:
      - uv (https://docs.astral.sh/uv/)
    content: |
      {
        "command": "uvx",
        "args": ["--from", "pdf-table-pull-lite", "pdf-table-pull-lite-mcp"]
      }
  - name: Python/Pip
    prerequisites:
      - pip install pdf-table-pull-lite
    content: |
      {
        "command": "pdf-table-pull-lite-mcp"
      }
