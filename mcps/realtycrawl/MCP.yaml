id: realtycrawl
name: RealtyCrawl
description: Discover real estate source capabilities and retrieve source-linked observations with explicit credit budgets.
author: realtycrawl
url: https://github.com/realtycrawl/realtycrawl-mcp
category: search
prerequisites:
  - A RealtyCrawl account and API key from https://realtycrawl.dev/dashboard
  - Credits for data operations; discovery metadata is free
  - Check get_capabilities before execution; research and unavailable operations are not live coverage
content:
  - name: Remote
    content: |
      {
        "type": "streamable-http",
        "url": "https://realtycrawl.dev/mcp",
        "headers": {
          "Authorization": "Bearer {{REALTYCRAWL_API_KEY}}"
        }
      }
parameters:
  - name: RealtyCrawl API Key
    key: REALTYCRAWL_API_KEY
    placeholder: your_realtycrawl_api_key
