id: socialdatax-instagram
name: SocialDataX Instagram MCP
description: "Instagram search, media details, comments, creator profiles, posts and transcripts.
  Hosted by SocialDataX; business calls consume credits. Setup and API Key:
  https://socialdatax.com/ai?from=kilo"
author: SocialDataX
url: https://github.com/DevinChen2014/instagram-mcp
category: search
prerequisites:
  - "SocialDataX account and your own API Key: https://socialdatax.com/ai?from=kilo"
  - Business tool calls consume SocialDataX credits; the account points-balance tool is free.
content:
  - name: Remote (Streamable HTTP)
    content: |
      {
        "type": "streamable-http",
        "url": "https://mcp.socialdatax.com/instagram/mcp",
        "headers": {
          "Authorization": "Bearer {{SOCIALDATAX_API_KEY}}"
        }
      }
parameters:
  - name: SocialDataX API Key
    key: SOCIALDATAX_API_KEY
    placeholder: your_socialdatax_api_key
