interface:
  display_name: "DealMachine"
  short_description: "Search and enrich real estate data"
  icon_small: "./assets/logo.png"
  icon_large: "./assets/logo.png"
  brand_color: "#0D9488"
  default_prompt: "Use $dealmachine to find high-equity absentee-owned properties in Austin and estimate the credit cost first."

dependencies:
  tools:
    - type: "mcp"
      value: "dealmachine"
      description: "DealMachine property, owner, and people intelligence"
      transport: "streamable_http"
      url: "https://mcp.dealmachine.com"

policy:
  allow_implicit_invocation: true
